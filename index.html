<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دکوراسیون داخلی لوکس</title>
    <style>
        /* ===== تنظیمات پایه ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0a0f;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* ===== پس‌زمینه پویا با ذرات ===== */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #1a1a2e, #0b0a0f 80%);
            z-index: 0;
            overflow: hidden;
        }

        .bg-particles::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(2px 2px at 20% 30%, #ffffff33, transparent),
                radial-gradient(2px 2px at 40% 70%, #ffffff22, transparent),
                radial-gradient(2px 2px at 70% 20%, #ffffff44, transparent),
                radial-gradient(2px 2px at 90% 80%, #ffffff33, transparent);
            background-size: 200px 200px;
            animation: sparkle 12s linear infinite;
            opacity: 0.6;
        }

        @keyframes sparkle {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-20px, -20px) scale(1.2);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }
        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #ff4d6d;
            top: -10%;
            left: -10%;
            animation-duration: 22s;
        }
        .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: #4d6dff;
            bottom: -20%;
            right: -10%;
            animation-duration: 26s;
            animation-delay: -5s;
        }
        .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #ffb347;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 20s;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, 20px) scale(1.05);
            }
        }

        /* ===== کانتینر اصلی ===== */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        /* ===== هدر شیشه‌ای ===== */
        .header {
            padding: 18px 20px 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-brand .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff4d6d, #ffb347);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(255, 77, 109, 0.3);
        }

        .header-brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #f8f9fa, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
        }

        .header-actions span {
            cursor: pointer;
            transition: 0.3s;
            padding: 4px;
        }
        .header-actions span:hover {
            color: #fff;
            transform: scale(1.1);
        }

        /* ===== اسلایدشو برتر ===== */
        .hero-slider {
            flex-shrink: 0;
            height: 38vh;
            margin: 10px 14px 6px;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .slider-track {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(1.04);
            transition: opacity 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform, opacity;
            border-radius: 28px;
            overflow: hidden;
        }

        .slide-item.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        .slide-item.exit {
            opacity: 0;
            transform: scale(1.08);
            z-index: 1;
        }

        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 28px;
        }

        .slide-item .overlay-grad {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
            border-radius: 0 0 28px 28px;
            pointer-events: none;
        }

        .slide-item .slide-label {
            position: absolute;
            bottom: 20px;
            right: 24px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            letter-spacing: 0.3px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slide-indicators {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: 0.4s ease;
            cursor: pointer;
        }
        .dot.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* ===== گالری با اسکرول عمودی (اینستاگرامی) ===== */
        .gallery-wrapper {
            flex: 1;
            position: relative;
            margin: 4px 0 0;
            overflow: hidden;
            touch-action: pan-y;
        }

        .gallery-scroll {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 0 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-scroll::-webkit-scrollbar {
            display: none;
        }

        .gallery-card {
            scroll-snap-align: start;
            flex-shrink: 0;
            height: calc(100vh - 38vh - 140px);
            min-height: 320px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            touch-action: pan-y;
        }

        .gallery-card:active {
            transform: scale(0.98);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 24px;
        }

        .gallery-card .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 22px 18px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            border-radius: 0 0 24px 24px;
            pointer-events: none;
        }

        .gallery-card .card-info h3 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        .gallery-card .card-info p {
            font-size: 13px;
            opacity: 0.7;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* ===== responsive ===== */
        @media (max-width: 480px) {
            .hero-slider {
                height: 32vh;
                margin: 6px 10px 4px;
                border-radius: 20px;
            }
            .slide-item .slide-label {
                font-size: 13px;
                bottom: 14px;
                right: 16px;
                padding: 4px 14px;
            }
            .header-brand h1 {
                font-size: 16px;
            }
            .header-brand .logo {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .gallery-card {
                height: calc(100vh - 32vh - 130px);
                min-height: 260px;
                border-radius: 18px;
            }
            .gallery-card .card-info h3 {
                font-size: 16px;
            }
            .gallery-card .card-info p {
                font-size: 12px;
            }
        }

        @media (min-width: 768px) {
            .hero-slider {
                height: 42vh;
                margin: 14px 24px 8px;
                border-radius: 32px;
            }
            .gallery-card {
                height: calc(100vh - 42vh - 160px);
                min-height: 400px;
                border-radius: 28px;
                margin: 0 10px;
            }
            .gallery-scroll {
                padding: 0 24px 20px;
                gap: 24px;
            }
            .header {
                padding: 22px 32px 14px;
            }
            .header-brand h1 {
                font-size: 26px;
            }
        }

        /* ===== حالت بارگذاری ===== */
        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            border-radius: inherit;
        }

        /* ===== انیمیشن ورود ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .hero-slider {
            animation: fadeUp 0.8s ease both 0.1s;
        }
        .gallery-wrapper {
            animation: fadeUp 0.8s ease both 0.3s;
        }
        .header {
            animation: fadeUp 0.6s ease both;
        }

        /* ===== لودینگ اولیه ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0b0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.6s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ff4d6d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-overlay p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- ===== لودینگ ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>📸 بارگذاری عکس‌ها...</p>
    </div>

    <!-- ===== پس‌زمینه ===== -->
    <div class="bg-particles">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- ===== اپلیکیشن ===== -->
    <div class="app-container">

        <!-- هدر -->
        <header class="header">
            <div class="header-brand">
                <div class="logo">🏠</div>
                <h1>دکوراسیون لوکس</h1>
            </div>
            <div class="header-actions">
                <span>❤️</span>
                <span>🔍</span>
                <span>☰</span>
            </div>
        </header>

        <!-- اسلایدشو برتر -->
        <section class="hero-slider" id="heroSlider">
            <div class="slider-track" id="sliderTrack">
                <!-- آیتم‌ها توسط JS ساخته می‌شوند -->
            </div>
            <div class="slide-indicators" id="slideIndicators"></div>
        </section>

        <!-- گالری با اسکرول عمودی -->
        <div class="gallery-wrapper">
            <div class="gallery-scroll" id="galleryScroll">
                <!-- کارت‌ها توسط JS ساخته می‌شوند -->
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  📸 لیست عکس‌ها — از 1.jpg تا 29.jpg
            // ============================================================
            const TOTAL_IMAGES = 29;
            const imageFiles = [];

            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                imageFiles.push(`image/${i}.jpg`);
            }

            // ============================================================
            //  برچسب‌های نمایشی
            // ============================================================
            const labels = [
                'شیک و مدرن', 'کلاسیک طلایی', 'مینیمال آرام',
                'صنعتی لوکس', 'اسکاندیناوی', 'نئوکلاسیک',
                'بوهمی رنگارنگ', 'ژاپنی وود', 'مدیترانه‌ای',
                'معاصر هنری', 'وینتیج شیک', 'اکو دوستانه',
                'لوکس طلایی', 'ساده سفید', 'چوب طبیعی',
                'آینه‌ای مدرن', 'پست مدرن', 'کلاسیک فرانسوی',
                'سبز آرام', 'آبی دریا', 'خاکستری شیک',
                'صورتی ملایم', 'طلایی گرم', 'نوین اروپایی',
                'روستیک مدرن', 'هنری انتزاعی', 'فضای باز',
                'نور طبیعی', 'شیشه و استیل'
            ];

            // ============================================================
            //  متغیرها
            // ============================================================
            const sliderTrack = document.getElementById('sliderTrack');
            const indicators = document.getElementById('slideIndicators');
            const galleryScroll = document.getElementById('galleryScroll');
            const loadingOverlay = document.getElementById('loadingOverlay');

            let currentSlide = 0;
            let slideInterval = null;
            const SLIDE_INTERVAL_MS = 3800;
            let isTransitioning = false;

            const totalSlides = imageFiles.length;

            // ============================================================
            //  توابع کمکی
            // ============================================================
            function getColor(index) {
                const colors = [
                    '#2b1f3d', '#1f3d2b', '#3d2b1f', '#1f2b3d', '#3d1f2b',
                    '#2b3d1f', '#3d1f3d', '#1f3d3d', '#3d2b2b', '#2b2b3d',
                    '#3d1f1f', '#1f3d1f', '#4a2a3a', '#2a4a3a', '#3a4a2a',
                    '#2a3a4a', '#4a2a2a', '#2a4a4a', '#5a2a3a', '#3a5a2a',
                    '#2a3a5a', '#5a3a2a', '#3a2a5a', '#2a5a3a', '#5a2a2a',
                    '#2a5a5a', '#5a5a2a', '#3a5a5a', '#5a3a5a'
                ];
                return colors[index % colors.length];
            }

            // ============================================================
            //  ساخت اسلایدشو
            // ============================================================
            function buildSlider() {
                sliderTrack.innerHTML = '';
                indicators.innerHTML = '';

                for (let i = 0; i < totalSlides; i++) {
                    // slide item
                    const slide = document.createElement('div');
                    slide.className = `slide-item${i === 0 ? ' active' : ''}`;
                    slide.dataset.index = i;

                    const img = document.createElement('img');
                    img.src = imageFiles[i];
                    img.alt = `دکوراسیون ${i + 1}`;
                    img.loading = 'lazy';
                    img.onerror = function() {
                        // اگر عکس وجود نداشت، placeholder
                        this.style.display = 'none';
                        const fallback = document.createElement('div');
                        fallback.className = 'loading-placeholder';
                        fallback.textContent = `✨ ${labels[i % labels.length] || 'دکوراسیون'}`;
                        fallback.style.background = `linear-gradient(135deg, ${getColor(i)}, #0b0a0f)`;
                        slide.appendChild(fallback);
                    };

                    const overlay = document.createElement('div');
                    overlay.className = 'overlay-grad';

                    const label = document.createElement('div');
                    label.className = 'slide-label';
                    label.textContent = labels[i % labels.length] || `سبک ${i + 1}`;

                    slide.appendChild(img);
                    slide.appendChild(overlay);
                    slide.appendChild(label);
                    sliderTrack.appendChild(slide);

                    // indicator dot
                    const dot = document.createElement('span');
                    dot.className = `dot${i === 0 ? ' active' : ''}`;
                    dot.dataset.index = i;
                    dot.addEventListener('click', function(e) {
                        e.stopPropagation();
                        goToSlide(parseInt(this.dataset.index));
                    });
                    indicators.appendChild(dot);
                }
            }

            // ============================================================
            //  ساخت گالری
            // ============================================================
            function buildGallery() {
                galleryScroll.innerHTML = '';

                for (let i = 0; i < totalSlides; i++) {
                    const card = document.createElement('div');
                    card.className = 'gallery-card';

                    const img = document.createElement('img');
                    img.src = imageFiles[i];
                    img.alt = `دکوراسیون ${i + 1}`;
                    img.loading = 'lazy';
                    img.onerror = function() {
                        this.style.display = 'none';
                        const fb = document.createElement('div');
                        fb.className = 'loading-placeholder';
                        fb.textContent = `🏠 ${labels[i % labels.length] || 'دکوراسیون'}`;
                        fb.style.background = `linear-gradient(135deg, ${getColor(i)}, #0b0a0f)`;
                        card.appendChild(fb);
                    };

                    const info = document.createElement('div');
                    info.className = 'card-info';
                    const h3 = document.createElement('h3');
                    h3.textContent = labels[i % labels.length] || `سبک ${i + 1}`;
                    const p = document.createElement('p');
                    p.textContent = 'دکوراسیون داخلی · طراحی لوکس';

                    info.appendChild(h3);
                    info.appendChild(p);

                    card.appendChild(img);
                    card.appendChild(info);
                    galleryScroll.appendChild(card);
                }
            }

            // ============================================================
            //  کنترل اسلایدشو
            // ============================================================
            function goToSlide(index) {
                if (isTransitioning || index === currentSlide) return;
                isTransitioning = true;

                const slides = sliderTrack.querySelectorAll('.slide-item');
                const dots = indicators.querySelectorAll('.dot');

                slides[currentSlide].classList.remove('active');
                slides[currentSlide].classList.add('exit');

                slides[index].classList.remove('exit');
                slides[index].classList.add('active');

                dots[currentSlide].classList.remove('active');
                dots[index].classList.add('active');

                setTimeout(() => {
                    slides[currentSlide].classList.remove('exit');
                    isTransitioning = false;
                }, 900);

                currentSlide = index;
                resetInterval();
            }

            function nextSlide() {
                const next = (currentSlide + 1) % totalSlides;
                goToSlide(next);
            }

            function resetInterval() {
                if (slideInterval) {
                    clearInterval(slideInterval);
                    slideInterval = null;
                }
                slideInterval = setInterval(nextSlide, SLIDE_INTERVAL_MS);
            }

            function startSlider() {
                resetInterval();
            }

            // ============================================================
            //  رویدادهای گالری (لمس + ماوس)
            // ============================================================
            let startY = 0;
            let isDragging = false;

            galleryScroll.addEventListener('touchstart', function(e) {
                startY = e.touches[0].clientY;
                isDragging = true;
            }, { passive: true });

            galleryScroll.addEventListener('touchmove', function(e) {
                // اجازه اسکرول پیش‌فرض
            }, { passive: true });

            galleryScroll.addEventListener('touchend', function(e) {
                isDragging = false;
            }, { passive: true });

            galleryScroll.addEventListener('mousedown', function(e) {
                startY = e.clientY;
                isDragging = true;
            });

            galleryScroll.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                e.preventDefault();
            });

            galleryScroll.addEventListener('mouseup', function() {
                isDragging = false;
            });

            galleryScroll.addEventListener('mouseleave', function() {
                isDragging = false;
            });

            // ============================================================
            //  کلیک روی کارت → بزرگنمایی (مثل اینستا)
            // ============================================================
            galleryScroll.addEventListener('click', function(e) {
                const card = e.target.closest('.gallery-card');
                if (!card) return;

                const img = card.querySelector('img');
                if (img && img.src) {
                    const overlay = document.createElement('div');
                    overlay.style.cssText = `
                        position: fixed; inset: 0; z-index: 999;
                        background: rgba(0,0,0,0.92);
                        display: flex; align-items: center; justify-content: center;
                        backdrop-filter: blur(20px);
                        animation: fadeUp 0.3s ease;
                        cursor: zoom-out;
                        padding: 20px;
                    `;
                    const clone = document.createElement('img');
                    clone.src = img.src;
                    clone.style.cssText = `
                        max-width: 100%; max-height: 90vh;
                        border-radius: 20px; box-shadow: 0 20px 80px rgba(0,0,0,0.8);
                        object-fit: contain;
                    `;
                    overlay.appendChild(clone);
                    document.body.appendChild(overlay);

                    overlay.addEventListener('click', function() {
                        overlay.remove();
                    });
                    overlay.addEventListener('touchstart', function(e) {
                        if (e.target === overlay) overlay.remove();
                    });
                }
            });

            // ============================================================
            //  کیبورد
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    nextSlide();
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prev = (currentSlide - 1 + totalSlides) % totalSlides;
                    goToSlide(prev);
                }
            });

            // ============================================================
            //  اجرا
            // ============================================================
            buildSlider();
            buildGallery();
            startSlider();

            // مخفی کردن لودینگ
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 500);

            console.log(`🏠 دکوراسیون داخلی لوکس — بارگذاری شد`);
            console.log(`📸 ${totalSlides} عکس (1.jpg تا ${totalSlides}.jpg) در اسلایدشو و گالری`);

        })();
    </script>

</body>
</html>
