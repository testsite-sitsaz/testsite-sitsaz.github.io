<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>دکوراسیون داخلی لوکس</title>

<style>
/* =========================================================
   RESET
========================================================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:#08070b;
    color:#fff;

    overflow:hidden;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}


/* =========================================================
   BACKGROUND
========================================================= */

.bg-particles{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,185,80,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(142,72,255,.13),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.025),
            transparent 50%
        ),
        #08070b;
}

.bg-particles::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            rgba(255,255,255,.25) 1px,
            transparent 1px
        );

    background-size:80px 80px;

    opacity:.18;

    animation:
        particleMove 20s linear infinite;
}

@keyframes particleMove{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-80px,-80px);
    }
}


/* =========================================================
   ORBS
========================================================= */

.orb{
    position:absolute;
    border-radius:50%;

    filter:blur(100px);

    opacity:.25;

    pointer-events:none;

    animation:
        orbFloat 18s ease-in-out infinite alternate;
}

.orb:nth-child(1){
    width:420px;
    height:420px;

    background:#ff9d38;

    top:-180px;
    left:-150px;

    animation-duration:22s;
}

.orb:nth-child(2){
    width:500px;
    height:500px;

    background:#7047ff;

    bottom:-220px;
    right:-180px;

    animation-duration:28s;
}

.orb:nth-child(3){
    width:300px;
    height:300px;

    background:#ff3d81;

    top:45%;
    left:45%;

    animation-duration:24s;
}

@keyframes orbFloat{

    0%{
        transform:translate3d(0,0,0) scale(1);
    }

    50%{
        transform:translate3d(40px,-35px,0) scale(1.12);
    }

    100%{
        transform:translate3d(-30px,35px,0) scale(.95);
    }
}


/* =========================================================
   APP
========================================================= */

.app-container{
    position:relative;
    z-index:2;

    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;

    background:transparent;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:relative;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;

    padding:
        12px
        16px
        10px;

    flex-shrink:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(25px) saturate(1.5);
    -webkit-backdrop-filter:blur(25px) saturate(1.5);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);

    animation:
        fadeDown .7s ease both;

    z-index:20;
}

@keyframes fadeDown{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   BRAND
========================================================= */

.header-brand{

    display:flex;
    align-items:center;

    gap:11px;

    min-width:0;
}

.logo{

    width:42px;
    height:42px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ffb347,
            #ff7a18 48%,
            #ff3d81
        );

    box-shadow:
        0 8px 25px rgba(255,140,50,.28),
        inset 0 1px 1px rgba(255,255,255,.4);

    position:relative;
    overflow:hidden;
}

.logo::before{

    content:"";

    position:absolute;

    width:80px;
    height:20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:rotate(-35deg);

    animation:shine 3s infinite;
}

@keyframes shine{

    0%{
        transform:translateX(-80px) rotate(-35deg);
    }

    50%,100%{
        transform:translateX(100px) rotate(-35deg);
    }
}

.logo svg{
    width:23px;
    height:23px;

    position:relative;
    z-index:2;

    filter:
        drop-shadow(0 2px 5px rgba(0,0,0,.3));
}

.header-brand h1{

    font-size:18px;
    font-weight:800;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffe1a6,
            #fff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.header-actions{

    display:flex;
    align-items:center;
    gap:8px;

    flex-shrink:0;
}

.contact-btn{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    height:40px;
    min-width:44px;

    padding:0 13px;

    border-radius:14px;

    color:#fff;

    text-decoration:none;

    font-size:13px;
    font-weight:700;

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(12px);
}

.contact-btn:hover{
    transform:translateY(-2px) scale(1.03);
}

.contact-btn:active{
    transform:scale(.94);
}

.contact-btn.call{

    background:
        linear-gradient(
            135deg,
            #00c853,
            #00a844
        );

    box-shadow:
        0 8px 22px rgba(0,200,83,.22);
}

.contact-btn.sms{

    background:
        linear-gradient(
            135deg,
            #2979ff,
            #655cff
        );

    box-shadow:
        0 8px 22px rgba(70,90,255,.22);
}

.icon-svg{

    width:19px;
    height:19px;

    flex-shrink:0;
}


/* =========================================================
   HERO
========================================================= */

.hero-slider{

    position:relative;

    flex-shrink:0;

    height:36vh;

    margin:
        9px
        14px
        5px;

    overflow:hidden;

    border-radius:28px;

    background:#111;

    box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        inset 0 0 0 1px rgba(255,255,255,.08);

    animation:
        fadeUp .8s ease .1s both;
}

.slider-track{
    position:relative;

    width:100%;
    height:100%;
}


/* =========================================================
   SLIDES
========================================================= */

.slide-item{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    opacity:0;

    transform:scale(1.06);

    transition:
        opacity .9s cubic-bezier(.25,.46,.45,.94),
        transform 1.1s cubic-bezier(.25,.46,.45,.94);

    overflow:hidden;

    background:#111;
}

.slide-item.active{

    opacity:1;

    transform:scale(1);

    z-index:2;
}

.slide-item.exit{

    opacity:0;

    transform:scale(1.1);

    z-index:1;
}


/* ---------------------------------------------------------
   HERO BACKDROP
--------------------------------------------------------- */

.slide-item::before{

    content:"";

    position:absolute;
    inset:-30px;

    background-image:
        var(--slide-image);

    background-size:cover;
    background-position:center;

    filter:blur(25px);

    opacity:.45;

    transform:scale(1.08);
}


/* ---------------------------------------------------------
   HERO IMAGE
--------------------------------------------------------- */

.slide-item img{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    z-index:1;

    filter:
        drop-shadow(
            0 20px 50px
            rgba(0,0,0,.65)
        );
}


/* ---------------------------------------------------------
   HERO OVERLAY
--------------------------------------------------------- */

.slide-item .overlay-grad{

    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.78),
            rgba(0,0,0,.08) 55%,
            rgba(0,0,0,.12)
        );
}


/* ---------------------------------------------------------
   HERO LABEL
--------------------------------------------------------- */

.slide-label{

    position:absolute;

    right:18px;
    bottom:17px;

    z-index:4;

    padding:7px 15px;

    border-radius:30px;

    font-size:13px;
    font-weight:700;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(255,179,71,.25),
            rgba(255,255,255,.08)
        );

    border:
        1px solid
        rgba(255,220,150,.25);

    backdrop-filter:blur(12px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}


/* =========================================================
   SLIDER DOTS
========================================================= */

.slide-indicators{

    position:absolute;

    bottom:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:8;

    display:flex;

    gap:5px;

    padding:5px 10px;

    border-radius:30px;

    background:rgba(0,0,0,.28);

    backdrop-filter:blur(10px);
}

.dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:rgba(255,255,255,.3);

    transition:.4s ease;

    cursor:pointer;
}

.dot.active{

    width:21px;

    border-radius:6px;

    background:
        linear-gradient(
            90deg,
            #ffb347,
            #ff5f6d
        );

    box-shadow:
        0 0 14px rgba(255,150,60,.55);
}


/* =========================================================
   EXPLORE / GALLERY
========================================================= */

.gallery-wrapper{

    flex:1;

    min-height:0;

    position:relative;

    overflow:hidden;

    animation:
        fadeUp .8s ease .25s both;
}

.gallery-scroll{

    width:100%;
    height:100%;

    overflow-y:auto;

    padding:
        4px
        14px
        20px;

    display:flex;
    flex-direction:column;

    gap:16px;

    scroll-snap-type:y mandatory;

    scroll-behavior:smooth;

    -webkit-overflow-scrolling:touch;

    scrollbar-width:none;

    touch-action:pan-y;
}

.gallery-scroll::-webkit-scrollbar{
    display:none;
}


/* =========================================================
   EXPLORE CARD
========================================================= */

.gallery-card{

    position:relative;

    width:100%;

    height:
        calc(
            100vh
            - 36vh
            - 122px
        );

    min-height:260px;

    flex-shrink:0;

    scroll-snap-align:start;

    overflow:hidden;

    border-radius:25px;

    cursor:pointer;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px rgba(0,0,0,.48);

    transition:
        transform .25s ease,
        box-shadow .3s ease;

    isolation:isolate;
}

.gallery-card:hover{

    transform:
        translateY(-3px)
        scale(1.005);

    box-shadow:
        0 22px 60px rgba(0,0,0,.58);
}

.gallery-card:active{
    transform:scale(.985);
}


/* =========================================================
   BLURRED IMAGE BACKGROUND
   مهم برای عکس‌های با نسبت متفاوت
========================================================= */

.gallery-card .image-backdrop{

    position:absolute;
    inset:-35px;

    background-image:
        var(--card-image);

    background-size:cover;
    background-position:center;

    filter:blur(25px);

    transform:scale(1.08);

    opacity:.5;

    z-index:-2;
}

.gallery-card .image-backdrop::after{

    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(10,8,15,.35),
            rgba(10,8,15,.7)
        );
}


/* =========================================================
   MAIN IMAGE
========================================================= */

.gallery-card .explore-image{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    z-index:-1;

    padding:0;

    filter:
        drop-shadow(
            0 15px 35px
            rgba(0,0,0,.55)
        );

    -webkit-user-drag:none;
}


/* =========================================================
   CARD GLOSS
========================================================= */

.gallery-card::before{

    content:"";

    position:absolute;

    inset:0;

    z-index:1;

    pointer-events:none;

    background:
        linear-gradient(
            115deg,
            transparent 0%,
            rgba(255,255,255,.05) 45%,
            transparent 55%
        );

    transform:
        translateX(-120%);

    transition:
        transform .8s ease;
}

.gallery-card:hover::before{
    transform:
        translateX(120%);
}


/* =========================================================
   CARD INFO
========================================================= */

.card-info{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:4;

    padding:
        55px
        18px
        16px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            rgba(0,0,0,.45) 55%,
            transparent
        );
}

.card-info h3{

    font-size:17px;

    font-weight:800;

    margin-bottom:4px;

    text-shadow:
        0 3px 15px rgba(0,0,0,.8);
}

.card-info p{

    font-size:12px;

    color:
        rgba(255,255,255,.68);
}


/* =========================================================
   EXPLORE BADGE
========================================================= */

.explore-badge{

    position:absolute;

    top:14px;
    right:14px;

    z-index:5;

    display:flex;

    align-items:center;

    gap:6px;

    padding:7px 11px;

    border-radius:20px;

    font-size:11px;
    font-weight:700;

    background:
        rgba(0,0,0,.32);

    border:
        1px solid
        rgba(255,255,255,.13);

    backdrop-filter:blur(12px);
}

.explore-badge svg{
    width:15px;
    height:15px;
}


/* =========================================================
   FULLSCREEN
========================================================= */

.fullscreen-gallery{

    position:fixed;
    inset:0;

    z-index:1000;

    display:none;
    flex-direction:column;

    background:
        rgba(4,3,7,.97);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    opacity:0;

    transition:
        opacity .3s ease;

    touch-action:pan-y;
}

.fullscreen-gallery.active{

    display:flex;

    opacity:1;
}


/* =========================================================
   FULLSCREEN HEADER
========================================================= */

.fullscreen-header{

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:12px 18px;

    z-index:20;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.6),
            transparent
        );
}

.close-btn{

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size:21px;

    cursor:pointer;

    transition:.25s;
}

.close-btn:hover{

    background:
        rgba(255,80,110,.2);

    transform:rotate(90deg) scale(1.08);
}

.counter{

    padding:7px 13px;

    border-radius:20px;

    font-size:12px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.1);

    backdrop-filter:blur(10px);

    color:
        rgba(255,255,255,.8);
}


/* =========================================================
   FULLSCREEN SCROLL
========================================================= */

.fullscreen-scroll{

    width:100%;
    height:100%;

    overflow-y:auto;

    scroll-snap-type:y mandatory;

    scroll-behavior:smooth;

    scrollbar-width:none;

    -ms-overflow-style:none;
}

.fullscreen-scroll::-webkit-scrollbar{
    display:none;
}


/* =========================================================
   FULLSCREEN ITEM
========================================================= */

.fullscreen-item{

    position:relative;

    width:100%;
    height:100vh;

    flex-shrink:0;

    scroll-snap-align:start;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    padding:25px;
}


/* =========================================================
   FULLSCREEN BACKDROP
========================================================= */

.fullscreen-item .fullscreen-backdrop{

    position:absolute;

    inset:-60px;

    background-image:
        var(--fullscreen-image);

    background-size:cover;
    background-position:center;

    filter:blur(35px);

    opacity:.3;

    transform:scale(1.08);
}


/* =========================================================
   FULLSCREEN IMAGE
========================================================= */

.fullscreen-item img{

    position:relative;

    z-index:2;

    width:100%;
    height:100%;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    border-radius:14px;

    filter:
        drop-shadow(
            0 25px 80px rgba(0,0,0,.8)
        );

    -webkit-user-drag:none;
}


/* =========================================================
   FULLSCREEN LABEL
========================================================= */

.item-label{

    position:absolute;

    z-index:5;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    padding:8px 18px;

    border-radius:30px;

    font-size:13px;
    font-weight:700;

    white-space:nowrap;

    background:
        rgba(0,0,0,.4);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:blur(14px);

    box-shadow:
        0 10px 30px rgba(0,0,0,.4);
}


/* =========================================================
   LOADING
========================================================= */

.loading-overlay{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:18px;

    background:#08070b;

    transition:
        opacity .6s ease;
}

.loading-overlay.hidden{

    opacity:0;

    pointer-events:none;
}

.spinner{

    width:54px;
    height:54px;

    border-radius:50%;

    border:
        4px solid
        rgba(255,255,255,.08);

    border-top-color:#ffb347;

    border-right-color:#ff5f6d;

    animation:
        spin .8s linear infinite;

    box-shadow:
        0 0 30px rgba(255,150,60,.2);
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loading-overlay p{

    font-size:14px;

    color:
        rgba(255,255,255,.6);
}


/* =========================================================
   FALLBACK
========================================================= */

.loading-placeholder{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:rgba(255,255,255,.55);

    font-size:14px;

    text-align:center;

    padding:20px;
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

    .header{

        padding:
            8px
            11px
            7px;
    }

    .logo{

        width:35px;
        height:35px;

        border-radius:11px;
    }

    .logo svg{
        width:20px;
        height:20px;
    }

    .header-brand h1{
        font-size:14px;
    }

    .contact-btn{

        width:40px;
        min-width:40px;

        height:36px;

        padding:0;

        border-radius:12px;
    }

    .contact-btn .label{
        display:none;
    }

    .icon-svg{
        width:17px;
        height:17px;
    }

    .hero-slider{

        height:30vh;

        margin:
            5px
            10px
            3px;

        border-radius:21px;
    }

    .gallery-scroll{

        padding:
            3px
            10px
            16px;

        gap:13px;
    }

    .gallery-card{

        height:
            calc(
                100vh
                - 30vh
                - 105px
            );

        min-height:220px;

        border-radius:20px;
    }

    .card-info{
        padding:
            50px
            14px
            13px;
    }

    .card-info h3{
        font-size:14px;
    }

    .card-info p{
        font-size:11px;
    }

    .explore-badge{

        top:11px;
        right:11px;

        font-size:10px;

        padding:6px 9px;
    }

    .slide-label{

        right:12px;
        bottom:12px;

        font-size:11px;

        padding:6px 11px;
    }

    .fullscreen-item{

        padding:15px;
    }

    .fullscreen-item img{
        max-height:90vh;
    }

    .item-label{

        bottom:22px;

        font-size:11px;

        padding:6px 14px;
    }
}


/* =========================================================
   TABLET / DESKTOP
========================================================= */

@media(min-width:768px){

    .header{

        padding:
            16px
            28px
            12px;
    }

    .header-brand h1{
        font-size:23px;
    }

    .contact-btn{

        height:44px;

        padding:
            0
            17px;

        border-radius:15px;

        font-size:14px;
    }

    .contact-btn .label{
        display:inline;
    }

    .hero-slider{

        height:42vh;

        margin:
            11px
            24px
            7px;

        border-radius:32px;
    }

    .gallery-scroll{

        padding:
            5px
            24px
            22px;

        gap:20px;
    }

    .gallery-card{

        height:
            calc(
                100vh
                - 42vh
                - 138px
            );

        min-height:380px;

        margin:
            0

<body>

<script>

(function(){

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const TOTAL_IMAGES = 29;

const SLIDE_INTERVAL_MS = 3800;


/* =========================================================
   IMAGE PATHS
========================================================= */

const imageFiles = [];

for(
    let i = 1;
    i <= TOTAL_IMAGES;
    i++
){

    imageFiles.push(
        `image/${i}.jpg`
    );

}


/* =========================================================
   LABELS
========================================================= */

const labels = [

    "شیک و مدرن",
    "کلاسیک طلایی",
    "مینیمال آرام",
    "صنعتی لوکس",
    "اسکاندیناوی",
    "نئوکلاسیک",
    "بوهمی رنگارنگ",
    "ژاپنی وود",
    "مدیترانه‌ای",
    "معاصر هنری",
    "وینتیج شیک",
    "اکو دوستانه",
    "لوکس طلایی",
    "ساده سفید",
    "چوب طبیعی",
    "آینه‌ای مدرن",
    "پست مدرن",
    "کلاسیک فرانسوی",
    "سبز آرام",
    "آبی دریا",
    "خاکستری شیک",
    "صورتی ملایم",
    "طلایی گرم",
    "نوین اروپایی",
    "روستیک مدرن",
    "هنری انتزاعی",
    "فضای باز",
    "نور طبیعی",
    "شیشه و استیل"

];


/* =========================================================
   DOM
========================================================= */

const sliderTrack =
    document.getElementById(
        "sliderTrack"
    );

const indicators =
    document.getElementById(
        "slideIndicators"
    );

const galleryScroll =
    document.getElementById(
        "galleryScroll"
    );

const fullscreenGallery =
    document.getElementById(
        "fullscreenGallery"
    );

const fullscreenScroll =
    document.getElementById(
        "fullscreenScroll"
    );

const closeGalleryBtn =
    document.getElementById(
        "closeGallery"
    );

const galleryCounter =
    document.getElementById(
        "galleryCounter"
    );

const loadingOverlay =
    document.getElementById(
        "loadingOverlay"
    );


/* =========================================================
   STATE
========================================================= */

let currentSlide = 0;

let slideInterval = null;

let isTransitioning = false;

const totalSlides =
    imageFiles.length;


/* =========================================================
   SVG EYE ICON
========================================================= */

function eyeIcon(){

    return `

    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path
            d="M2 12s3.5-6 10-6
            10 6 10 6
            -3.5 6-10 6
            -10-6-10-6z"/>

        <circle
            cx="12"
            cy="12"
            r="2.5"/>

    </svg>

    `;

}


/* =========================================================
   COLOR FALLBACK
========================================================= */

function getColor(index){

    const colors = [

        "#2b1f3d",
        "#1f3d2b",
        "#3d2b1f",
        "#1f2b3d",
        "#3d1f2b",
        "#2b3d1f",
        "#3d1f3d",
        "#1f3d3d",
        "#3d2b2b",
        "#2b2b3d",
        "#3d1f1f",
        "#1f3d1f"

    ];

    return colors[
        index % colors.length
    ];

}


/* =========================================================
   SAFE IMAGE LOAD
========================================================= */

function handleImageError(
    img,
    parent,
    index,
    text
){

    img.style.display = "none";

    const fallback =
        document.createElement("div");

    fallback.className =
        "loading-placeholder";

    fallback.textContent =
        text ||
        labels[
            index % labels.length
        ];

    fallback.style.background =
        `linear-gradient(
            135deg,
            ${getColor(index)},
            #08070b
        )`;

    parent.appendChild(
        fallback
    );

}


/* =========================================================
   SLIDER
========================================================= */

function buildSlider(){

    sliderTrack.innerHTML = "";

    indicators.innerHTML = "";


    for(
        let i = 0;
        i < totalSlides;
        i++
    ){

        const slide =
            document.createElement("div");

        slide.className =
            "slide-item" +
            (
                i === 0
                ? " active"
                : ""
            );

        slide.dataset.index = i;


        const img =
            document.createElement("img");

        img.src =
            imageFiles[i];

        img.alt =
            `دکوراسیون داخلی ${i + 1}`;

        img.decoding = "async";

        if(i > 1){
            img.loading = "lazy";
        }


        /* مهم:
           عکس به عنوان بک‌گراند تار
           برای نسبت‌های متفاوت
        */

        slide.style.setProperty(
            "--slide-image",
            `url("${imageFiles[i]}")`
        );


        img.onerror = function(){

            handleImageError(
                this,
                slide,
                i,
                `✨ ${
                    labels[
                        i % labels.length
                    ]
                }`
            );

        };


        const overlay =
            document.createElement("div");

        overlay.className =
            "overlay-grad";


        const label =
            document.createElement("div");

        label.className =
            "slide-label";

        label.textContent =
            labels[
                i % labels.length
            ];


        slide.appendChild(img);

        slide.appendChild(overlay);

        slide.appendChild(label);

        sliderTrack.appendChild(slide);


        /* DOT */

        const dot =
            document.createElement("span");

        dot.className =
            "dot" +
            (
                i === 0
                ? " active"
                : ""
            );

        dot.dataset.index = i;


        dot.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                goToSlide(
                    Number(
                        this.dataset.index
                    )
                );

            }
        );


        indicators.appendChild(dot);

    }

}


/* =========================================================
   EXPLORE GALLERY
========================================================= */

function buildGallery(){

    galleryScroll.innerHTML = "";


    for(
        let i = 0;
        i < totalSlides;
        i++
    ){

        const card =
            document.createElement("div");

        card.className =
            "gallery-card";

        card.dataset.index = i;


        /* BACKDROP */

        const backdrop =
            document.createElement("div");

        backdrop.className =
            "image-backdrop";

        backdrop.style.setProperty(
            "--card-image",
            `url("${imageFiles[i]}")`
        );


        /* MAIN IMAGE */

        const img =
            document.createElement("img");

        img.className =
            "explore-image";

        img.src =
            imageFiles[i];

        img.alt =
            `دکوراسیون داخلی ${
                i + 1
            }`;

        img.decoding = "async";

        img.loading =
            i < 3
            ? "eager"
            : "lazy";


        img.onerror = function(){

            handleImageError(
                this,
                card,
                i,
                `🏠 ${
                    labels[
                        i % labels.length
                    ]
                }`
            );

        };


        /* BADGE */

        const badge =
            document.createElement("div");

        badge.className =
            "explore-badge";

        badge.innerHTML =
            eyeIcon() +
            "<span>مشاهده</span>";


        /* INFO */

        const info =
            document.createElement("div");

        info.className =
            "card-info";


        const h3 =
            document.createElement("h3");

        h3.textContent =
            labels[
                i % labels.length
            ];


        const p =
            document.createElement("p");

        p.textContent =
            "دکوراسیون داخلی · طراحی لوکس";


        info.appendChild(h3);

        info.appendChild(p);


        card.appendChild(
            backdrop
        );

        card.appendChild(
            img
        );

        card.appendChild(
            badge
        );

        card.appendChild(
            info
        );


        card.addEventListener(
            "click",
            function(){

                openFullscreen(
                    Number(
                        this.dataset.index
                    )
                );

            }
        );


        galleryScroll.appendChild(
            card
        );

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

function buildFullscreenGallery(){

    fullscreenScroll.innerHTML = "";


    for(
        let i = 0;
        i < totalSlides;
        i++
    ){

        const item =
            document.createElement("div");

        item.className =
            "fullscreen-item";

        item.dataset.index = i;


        /* BLURRED BACKGROUND */

        const backdrop =
            document.createElement("div");

        backdrop.className =
            "fullscreen-backdrop";

        backdrop.style.setProperty(
            "--fullscreen-image",
            `url("${imageFiles[i]}")`
        );


        /* IMAGE */

        const img =
            document.createElement("img");

        img.src =
            imageFiles[i];

        img.alt =
            `دکوراسیون داخلی ${
                i + 1
            }`;

        img.loading =
            i === 0
            ? "eager"
            : "lazy";

        img.decoding =
            "async";


        img.onerror = function(){

            handleImageError(
                this,
                item,
                i,
                `📸 ${
                    labels[
                        i % labels.length
                    ]
                }`
            );

        };


        /* LABEL */

        const label =
            document.createElement("div");

        label.className =
            "item-label";

        label.textContent =
            labels[
                i % labels.length
            ];


        item.appendChild(
            backdrop
        );

        item.appendChild(
            img
        );

        item.appendChild(
            label
        );


        fullscreenScroll.appendChild(
            item
        );

    }

}


/* =========================================================
   OPEN FULLSCREEN
========================================================= */

function openFullscreen(index){

    fullscreenGallery.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";


    const items =
        fullscreenScroll.querySelectorAll(
            ".fullscreen-item"
        );


    if(items[index]){

        fullscreenScroll.scrollTop =
            items[index].offsetTop;

    }


    updateCounter(index);

}


/* =========================================================
   CLOSE
========================================================= */

function closeFullscreen(){

    fullscreenGallery.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";

}


/* =========================================================
   COUNTER
========================================================= */

function updateCounter(index){

    galleryCounter.textContent =
        `${index + 1} / ${totalSlides}`;

}


/* =========================================================
   SLIDE
========================================================= */

function goToSlide(index){

    if(
        isTransitioning ||
        index === currentSlide
    ){

        return;

    }


    const slides =
        sliderTrack.querySelectorAll(
            ".slide-item"
        );

    const dots =
        indicators.querySelectorAll(
            ".dot"
        );


    if(
        !slides[index] ||
        !slides[currentSlide]
    ){

        return;

    }


    isTransitioning = true;


    slides[currentSlide]
        .classList
        .remove("active");


    slides[currentSlide]
        .classList
        .add("exit");


    slides[index]
        .classList
        .remove("exit");


    slides[index]
        .classList
        .add("active");


    dots[currentSlide]
        ?.classList
        .remove("active");


    dots[index]
        ?.classList
        .add("active");


    const oldSlide =
        currentSlide;


    currentSlide =
        index;


    setTimeout(
        function(){

            slides[oldSlide]
                ?.classList
                .remove("exit");

            isTransitioning =
                false;

        },
        900
    );


    resetInterval();

}


/* =========================================================
   NEXT
========================================================= */

function nextSlide(){

    const next =
        (
            currentSlide + 1
        ) % totalSlides;

    goToSlide(next);

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSlide(){

    const previous =
        (
            currentSlide -
            1 +
            totalSlides
        ) % totalSlides;

    goToSlide(previous);

}


/* =========================================================
   INTERVAL
========================================================= */

function resetInterval(){

    if(slideInterval){

        clearInterval(
            slideInterval
        );

    }


    slideInterval =
        setInterval(
            nextSlide,
            SLIDE_INTERVAL_MS
        );

}


/* =========================================================
   FULLSCREEN SCROLL COUNTER
========================================================= */

fullscreenScroll.addEventListener(
    "scroll",
    function(){

        const items =
            this.querySelectorAll(
                ".fullscreen-item"
            );

        if(!items.length){
            return;
        }


        const scrollTop =
            this.scrollTop;

        let index =
            Math.round(
                scrollTop /
                window.innerHeight
            );


        index =
            Math.max(
                0,
                Math.min(
                    index,
                    items.length - 1
                )
            );


        updateCounter(index);

    },
    {
        passive:true
    }
);


/* =========================================================
   CLOSE BUTTON
========================================================= */

closeGalleryBtn.addEventListener(
    "click",
    closeFullscreen
);


/* =========================================================
   CLICK OUTSIDE
========================================================= */

fullscreenGallery.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            fullscreenGallery
        ){

            closeFullscreen();

        }

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        const fullscreenOpen =
            fullscreenGallery.classList.contains(
                "active"
            );


        if(fullscreenOpen){

            const items =
                fullscreenScroll.querySelectorAll(
                    ".fullscreen-item"
                );


            let index =
                Math.round(
                    fullscreenScroll.scrollTop /
                    window.innerHeight
                );


            if(
                e.key === "Escape"
            ){

                closeFullscreen();

                return;

            }


            if(
                e.key === "ArrowDown" ||
                e.key === "ArrowRight"
            ){

                e.preventDefault();

                index =
                    Math.min(
                        index + 1,
                        items.length - 1
                    );

            }


            else if(
                e.key === "ArrowUp" ||
                e.key === "ArrowLeft"
            ){

                e.preventDefault();

                index =
                    Math.max(
                        index - 1,
                        0
                    );

            }


            if(items[index]){

                fullscreenScroll.scrollTo({

                    top:
                        items[index].offsetTop,

                    behavior:
                        "smooth"

                });

                updateCounter(index);

            }


        }

        else{

            if(
                e.key === "ArrowRight" ||
                e.key === "ArrowDown"
            ){

                e.preventDefault();

                nextSlide();

            }

            else if(
                e.key === "ArrowLeft" ||
                e.key === "ArrowUp"
            ){

                e.preventDefault();

                previousSlide();

            }

        }

    }
);


/* =========================================================
   PRELOAD FIRST IMAGES
========================================================= */

function preloadFirstImages(){

    const count =
        Math.min(
            3,
            imageFiles.length
        );


    for(
        let i = 0;
        i < count;
        i++
    ){

        const image =
            new Image();

        image.src =
            imageFiles[i];

    }

}


/* =========================================================
   INIT
========================================================= */

buildSlider();

buildGallery();

buildFullscreenGallery();

preloadFirstImages();

resetInterval();


/* =========================================================
   LOADING
========================================================= */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            function(){

                loadingOverlay.classList.add(
                    "hidden"
                );

            },
            450
        );

    }
);


setTimeout(
    function(){

        loadingOverlay.classList.add(
            "hidden"
        );

    },
    1500
);


/* =========================================================
   LOG
========================================================= */

console.log(
    "🏠 دکوراسیون داخلی لوکس"
);

console.log(
    `📸 ${totalSlides} عکس آماده شد`
);

console.log(
    "📐 سیستم نمایش تصاویر با نسبت‌های مختلف فعال است"
);

console.log(
    "📞 +989122987793"
);


})();

</script>
